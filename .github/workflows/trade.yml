name: Trading Bot

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes, 24/7
  workflow_dispatch:           # manual trigger from GitHub UI

# Only ever run ONE trading cycle at a time. If a manual run and a scheduled
# run (or two scheduled runs) overlap, the second waits instead of executing
# concurrently — this prevents two cycles racing on the shared trade DB cache,
# double-trading, or overcommitting the wallet. We never cancel a run mid-cycle
# (cancel-in-progress: false) so an in-flight trade/settlement always finishes.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 4 spaced cycles (~15 min) + settlement/retrain headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore trade database + trained model
        uses: actions/cache/restore@v4   # restore-only: no auto-save
        with:
          path: |
            tradetestagent.db
            ml/xgb_calibrator.joblib
          key: trade-db-${{ github.run_number }}
          restore-keys: |
            trade-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init database
        run: python -c "from core.database import init_db; init_db()"

      - name: Run one trading cycle
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          LLM_ENABLED: "true"            # LLM on; the bot PROBES credits each run and auto-falls back to free mode if exhausted — no manual flipping needed.
          LIVE_EXCHANGE: polymarket_us
          BANKROLL_USDC: "35.0"          # fallback only — real wallet balance is fetched live each cycle (user withdrew $50; ~$37 remains)
          AB_TESTING_ENABLED: "true"
          MIN_CONFIDENCE: "0.30"         # FAVORITES MODE: loose (the favorite floor + 2-of-3 vote do the filtering)
          MIN_EDGE: "0.0"                # FAVORITES MODE: back favorites even near fair value (win-rate priority)
          FEE_BUFFER: "0.0"
          MIN_ENTRY_PRICE: "0.68"        # FAVORITES MODE: only bet sides priced >= 68% → targets ~70% win rate
          # ── Market universe: floors sized to OUR stake, not to a whale's ──
          # A flat $1000 liquidity / $500 volume floor rejected ~790 of 800
          # fetched markets, starving the bot of candidates while it bets $2-$10.
          # Liquidity is now stake-proportionate (25x largest flat = $250) and
          # volume just proves the market is alive. Quality gates (>=0.68 entry,
          # trap-veto, past-event, near-certainty) are UNCHANGED.
          LIQUIDITY_STAKE_MULTIPLE: "25.0"    # need 25x our stake in book depth
          MIN_LIQUIDITY_FLOOR_ABS: "150.0"    # never trade a book thinner than $150
          MIN_VOLUME_USDC: "150.0"            # was $500 — proves the market trades, without demanding whale flow
          MIN_TIME_TO_RESOLUTION_DAYS: "0"    # short-term "obvious" plays
          # 784 of 800 fetched markets were being dropped by this single filter —
          # it is THE binding constraint on the candidate pool, dwarfing every
          # other gate (liquidity now rejects zero). At 60d the bot sees ~5-9
          # markets, holds all the tradeable ones, and sits on idle cash. Widen
          # to the code default so there is actually something to choose from;
          # scan_agent still spreads picks across near/mid/far buckets and mildly
          # prefers <=45d, so short-dated favorites keep priority.
          MAX_TIME_TO_RESOLUTION_DAYS: "120"
          KELLY_FRACTION: "0.45"         # bigger bets that scale with edge/bankroll
          MAX_BET_FRACTION: "0.25"       # per-bet cap raised to 25% (conviction scaling keeps weak bets small)
          MAX_OPEN_POSITIONS: "20"       # room for ~20 concurrent plays (the wallet's cash guard is the real limiter on $35)
          # ── Continuous stake sizing (replaces the flat ladder's $100 cliff) ──
          # Bets are a PERCENTAGE of the live wallet, so every dollar gained or
          # deposited makes the next bet a little bigger, and every dollar lost
          # makes it smaller — no plateau where $37 and $99 bet identically.
          # $37→$2.96 | $65→$5.20 | $100→$8.00 | $250→$20.00 (confident)
          CONFIDENT_STAKE_PCT: "0.08"    # high-conviction favorite: 8% of bankroll
          ORDINARY_STAKE_PCT: "0.035"    # ordinary backed favorite: 3.5%
          MAX_TRADES_PER_CYCLE: "8"      # ceiling; actual budget scales with bankroll (<$50→2, <$100→3, <$250→5)
          FLAT_BET_BASE: "2.0"           # legacy ladder (retained for reference/fallback)
          FLAT_BET_CONFIDENT: "5.0"
          FLAT_BET_SCALED: "10.0"
          FAVORITE_CONFIDENT_CONF: "0.80"        # conviction (≈ YES price) to earn the $5 / 2nd-slot tier
          SCALE_UP_BANKROLL: "100.0"     # cross this live balance → bigger $10 flats
          MAX_POSITIONS_PER_EVENT: "1"           # ordinary picks: 1 per event (no stacking weak sub-markets)
          MAX_POSITIONS_PER_EVENT_CONFIDENT: "2" # confident favorites may double up on one event
          PAUSE_NEW_TRADES: "false"      # flip to "true" to hold positions and open nothing new
          # Unattended-run guardrails (owner away ~2 weeks from 2026-08-02).
          # Equity was $56.49 at departure; halt NEW positions if it falls to
          # $40 (~-29%). Open positions keep being managed and settled, so the
          # 13 pending favorites still resolve and feed the learning loop.
          EQUITY_FLOOR_USDC: "40.0"
          MIN_CASH_RESERVE_FRACTION: "0.25"   # keep dry powder; never deploy to zero
          NOTIFY_SMTP_HOST: smtp.gmail.com
          NOTIFY_SMTP_PORT: "587"
        # GitHub throttles scheduled workflows hard: this cron asks for every 20
        # minutes but actually fires roughly every 105 minutes. Rather than one
        # check per ~2 hours, run several SPACED cycles inside a single job so
        # settlements, price moves and newly-listed markets are picked up near
        # the intended cadence. 4 cycles x 300s ≈ 15 min of coverage per job.
        #
        # No --max-trades: the trade budget is derived from the LIVE wallet
        # (see _max_trades_for_bankroll) and is SHARED across these cycles, so
        # running 4 of them does not authorise 4x the trades.
        run: python main.py --live --cycles 4 --cycle-delay 300 --top-n 35

      - name: Retrain model on settled trades (continuous learning)
        run: python main.py --retrain || echo "Not enough settled trades to retrain yet"

      - name: Persist updated database + trained model
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            tradetestagent.db
            ml/xgb_calibrator.joblib
          key: trade-db-${{ github.run_number }}
